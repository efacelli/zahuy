# Render Blueprint — sitio estático del frontend (docs/DEPLOY.md §5).
# No contiene secretos: las variables con `sync: false` se cargan en el panel de Render.
services:
  - type: web
    name: zahuy
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      # Solo la clave PÚBLICA (publishable). La app no arranca con una service_role.
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      # SPA (react-router): toda ruta sirve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
